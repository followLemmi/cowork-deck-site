name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The build and the SEO gate run on every pull request as well, and the
  # ruleset on main requires them to pass. A broken canonical, a duplicated
  # description or a 2 MB screenshot cannot be merged.
  pull_request:
    branches: [main]
  # The changelog and the download links are baked in at build time, so a new
  # release in the application repository has to trigger a rebuild here. Two
  # ways in: a nightly run that needs nobody, and a manual one for when you do
  # not want to wait for it.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  # Fired by the application repository's release workflow, when a token for it
  # exists. Optional: the nightly run is the floor.
  repository_dispatch:
    types: [release-published]

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy replaces the one waiting, never cancels the one running.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` fetches the releases first. The token is only there to
      # lift the unauthenticated API's 60-requests-an-hour limit; the build
      # falls back to the committed copy of releases.json if the call fails, so
      # a rate limit is a stale changelog rather than a red build.
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the build for the mistakes that cost rankings
        run: node scripts/check-seo.mjs

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Bing and Yandex, told rather than waited for. Google does not take
  # IndexNow; for Google the sitemap is the mechanism.
  notify:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/ping-indexnow.mjs
